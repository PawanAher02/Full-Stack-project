<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Perfect Coaching Classes</title>
    <meta name="description" content="Secure administrative login gateway for Perfect Coaching Classes directors and academic faculty.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dash-navy: #0b3954;
            --dash-navy-dark: #072538;
            --dash-teal: #1c838b;
            --dash-orange: #d96b27;
            --dash-orange-hover: #c45d1d;
            --dash-ink: #142a3e;
            --dash-muted: #64748b;
            --dash-border: #cbd5e1;
            --dash-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 25%, #0f4c75 0%, #08283e 50%, #03131f 100%);
            color: #1e293b;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Subtle glowing background orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            opacity: 0.28;
            z-index: 0;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: #d96b27;
            top: 5%;
            left: 10%;
        }

        body::after {
            width: 480px;
            height: 480px;
            background: #1c838b;
            bottom: 5%;
            right: 10%;
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: fadeInCard 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 18px;
            padding: 38px 32px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            text-align: center;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 26px;
        }

        .brand-logo-icon {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--dash-orange), #ff7828);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(217, 107, 39, 0.4);
            margin-bottom: 14px;
        }

        .brand-title {
            font-family: 'Outfit', sans-serif;
            font-size: 21px;
            font-weight: 800;
            color: var(--dash-navy);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #e0f2f1;
            color: #00695c;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .login-alert {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            margin-bottom: 20px;
            text-align: left;
            display: none;
            line-height: 1.4;
        }

        .login-alert.error {
            display: block;
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .login-alert.success {
            display: block;
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--dash-navy);
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 15px;
            color: var(--dash-muted);
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            font-size: 14.5px;
            border: 1.5px solid var(--dash-border);
            border-radius: 9px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #0f172a;
            background: #ffffff;
        }

        .form-input:focus {
            border-color: var(--dash-teal);
            box-shadow: 0 0 0 3.5px rgba(28, 131, 139, 0.15);
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            font-size: 12px;
            color: var(--dash-orange);
            font-weight: 700;
            cursor: pointer;
            padding: 4px 6px;
        }

        .password-toggle-btn:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--dash-orange), #ff7828);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(217, 107, 39, 0.35);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: linear-gradient(135deg, var(--dash-orange-hover), #f36c1e);
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(217, 107, 39, 0.45);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* Credentials helper card */
        .demo-credentials-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            font-size: 12px;
            color: #334155;
        }

        .demo-credentials-box code {
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            color: var(--dash-navy);
        }

        .autofill-btn {
            background: #ffffff;
            border: 1px solid var(--dash-border);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            color: var(--dash-teal);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .autofill-btn:hover {
            background: var(--dash-teal);
            color: #ffffff;
            border-color: var(--dash-teal);
        }


        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            text-decoration: none;
            margin-top: 22px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand & Heading -->
            <div class="login-brand">
                <div class="brand-logo-icon">P</div>
                <h1 class="brand-title">PERFECT COACHING CLASSES</h1>
                <div class="brand-badge">🔐 Director & Admin Portal</div>
            </div>

            <!-- Notification Alerts -->
            <div id="loginAlert" class="login-alert"></div>

            <!-- Login Form -->
            <form id="adminLoginForm" onsubmit="handleLoginSubmit(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="adminUsername">
                        <span>Username / ID</span>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="adminUsername" class="form-input" placeholder="Enter username (pawanaher)" required autocomplete="username" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">
                        <span>Password</span>
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()">Show Password</button>
                    </label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="adminPassword" class="form-input" placeholder="Enter password (8546)" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="submitLoginBtn" class="login-btn">
                    <span>🔐 Sign In to Admin Console</span>
                </button>
            </form>

            <!-- Quick Credentials Box -->
            <div class="demo-credentials-box">
                <div>
                    <div style="font-weight: 700; margin-bottom: 2px;">Administrator Credentials:</div>
                    <span>User: <code>pawanaher</code> &bull; Pass: <code>8546</code></span>
                </div>
                <button type="button" class="autofill-btn" onclick="autofillCredentials()" title="Quick fill login inputs">
                    ⚡ Quick Fill
                </button>
            </div>
        </div>

        <!-- Back to Website -->
        <div style="text-align: center;">
            <a href="index.html" class="back-link">
                &larr; Return to Main Website
            </a>
        </div>
    </div>

    <script>
        // Dynamic API Base URL detection (works in production deployment, localhost:5000, or Live Server)
        const API_BASE = (window.location.protocol === 'file:' || window.location.port === '5500' || window.location.port === '3000')
            ? 'http://localhost:5000'
            : '';

        // Always require fresh login on visit - never auto-redirect
        document.addEventListener('DOMContentLoaded', () => {
            sessionStorage.removeItem('pcc_admin_token');
            sessionStorage.removeItem('pcc_admin_user');
            localStorage.removeItem('pcc_admin_token');
            localStorage.removeItem('pcc_admin_user');

            const passInput = document.getElementById('adminPassword');
            if (passInput) passInput.value = '';

            const params = new URLSearchParams(window.location.search);
            if (params.get('logged_out') === '1') {
                showAlert('You have been logged out. Enter your credentials to sign in.', 'success');
            } else if (params.get('expired') === '1') {
                showAlert('Your session has expired. Please enter username and password to continue.', 'error');
            }
        });

        // Show Alert Helper
        function showAlert(message, type = 'error') {
            const alertEl = document.getElementById('loginAlert');
            alertEl.className = `login-alert ${type}`;
            alertEl.innerHTML = (type === 'error' ? '⚠️ ' : '✅ ') + message;
        }

        // Autofill Credentials
        function autofillCredentials() {
            document.getElementById('adminUsername').value = 'pawanaher';
            document.getElementById('adminPassword').value = '8546';
            const alertEl = document.getElementById('loginAlert');
            alertEl.style.display = 'none';
        }

        // Toggle Password Visibility
        function togglePasswordVisibility() {
            const passInput = document.getElementById('adminPassword');
            const toggleBtn = document.querySelector('.password-toggle-btn');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                toggleBtn.textContent = 'Hide Password';
            } else {
                passInput.type = 'password';
                toggleBtn.textContent = 'Show Password';
            }
        }

        // Form Submit Handler
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('adminUsername');
            const passwordInput = document.getElementById('adminPassword');
            const submitBtn = document.getElementById('submitLoginBtn');

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showAlert('Please enter both your username and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>⏳ Verifying credentials...</span>';

            try {
                const response = await fetch(`${API_BASE}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json().catch(() => ({}));

                if (response.ok && result.success && result.token) {
                    // Save in sessionStorage only (requires login every time browser or tab is reopened)
                    sessionStorage.setItem('pcc_admin_token', result.token);
                    if (result.user) {
                        sessionStorage.setItem('pcc_admin_user', JSON.stringify(result.user));
                    }
                    localStorage.removeItem('pcc_admin_token');
                    localStorage.removeItem('pcc_admin_user');

                    showAlert(`Login successful! Redirecting to admin console...`, 'success');
                    setTimeout(() => {
                        window.location.replace('admin.html');
                    }, 350);
                } else {
                    showAlert(result.error || 'Invalid username or password. Please check and try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>🔐 Sign In to Admin Console</span>';
                    passwordInput.focus();
                }
            } catch (err) {
                console.warn('Login network offline, testing local credentials:', err);
                // Offline fallback authentication for pawanaher / 8546
                if (username.toLowerCase() === 'pawanaher' && password === '8546') {
                    const offlineToken = 'pcc_token_pawanaher_8546';
                    const offlineUser = { username: 'pawanaher', name: 'Pawan Aher (Director)', role: 'Super Admin' };
                    sessionStorage.setItem('pcc_admin_token', offlineToken);
                    sessionStorage.setItem('pcc_admin_user', JSON.stringify(offlineUser));
                    localStorage.removeItem('pcc_admin_token');
                    localStorage.removeItem('pcc_admin_user');

                    showAlert('Login verified! Redirecting to admin console...', 'success');
                    setTimeout(() => {
                        window.location.replace('admin.html');
                    }, 350);
                    return;
                }

                showAlert('Unable to connect to server. Please verify credentials (pawanaher / 8546).');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🔐 Sign In to Admin Console</span>';
            }
        }
    </script>
</body>

</html>
